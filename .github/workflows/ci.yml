name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate deployment contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck jq

      - name: Check shell syntax and style
        run: |
          for script in deploy/init.sh deploy/laminar/bootstrap-project-key.sh tests/*.sh tests/fixtures/*; do
            bash -n "$script"
          done
          shellcheck --severity=warning deploy/init.sh deploy/laminar/bootstrap-project-key.sh tests/*.sh tests/fixtures/*

      - name: Test bootstrap without a container runtime
        run: |
          bash tests/bootstrap.sh
          bash tests/validation-regressions.sh
          COLLECTOR_RUNTIME_VALIDATE=required bash tests/collector-invariants.sh
          COLLECTOR_PERSISTENCE_RUNTIME=required bash tests/collector-persistence.sh

      - name: Check text and secret hygiene
        run: |
          git diff --check
          tests/compose-invariants.sh

      - name: Validate Compose model
        run: |
          docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet
          bash tests/compose-required-settings.sh

      - name: Lint Dockerfile syntax
        run: |
          docker buildx build --check --file deploy/Dockerfile.mlflow deploy
          docker buildx build --check --file deploy/Dockerfile.laminar deploy
