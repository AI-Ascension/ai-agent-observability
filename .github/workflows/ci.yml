name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recorded-run:
    name: Validate recorded-run candidate consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
      - name: Verify exact contract bytes and independent consumer
        run: node --test tests/recorded-run-*.test.mjs

  validate:
    name: Validate deployment contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # The root-packet lifecycle fixture clones this checkout and verifies
          # that it contains the reviewed candidate commit, so the full history
          # must be present rather than a single-commit shallow checkout.
          fetch-depth: 0

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check shell syntax and style
        run: |
          for script in deploy/storage/*.sh deploy/init.sh deploy/materialize-otel-source.sh deploy/ai-agent-observability-reviewed-upgrade deploy/install-reviewed-upgrade-root-packet.sh deploy/laminar/bootstrap-project-key.sh deploy/laminar/provision-query-readonly.sh tests/*.sh tests/fixtures/*; do
            bash -n "$script"
          done
          shellcheck --severity=warning deploy/storage/*.sh deploy/init.sh deploy/materialize-otel-source.sh deploy/ai-agent-observability-reviewed-upgrade deploy/install-reviewed-upgrade-root-packet.sh deploy/laminar/bootstrap-project-key.sh deploy/laminar/provision-query-readonly.sh tests/*.sh tests/fixtures/*

      - name: Enable unprivileged user namespaces
        run: |
          # The root-packet lifecycle fixture maps its user to root with
          # `unshare -Ur`. Ubuntu 24.04 restricts unprivileged user namespaces
          # through AppArmor; lift that restriction for this disposable runner so
          # the fixture can exercise the real root-owned installation path.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi

      - name: Test bootstrap without a container runtime
        run: |
          bash tests/bootstrap.sh
          bash tests/storage-admission.sh
          bash tests/storage-lifecycle.sh
          bash tests/validation-regressions.sh
          bash tests/query-provision-invariants.sh
          bash tests/otel-health-probe.sh
          COLLECTOR_PERSISTENCE_RUNTIME=required bash tests/collector-persistence-invariants.sh
          COLLECTOR_PERSISTENCE_RUNTIME=required bash tests/collector-persistence.sh
          bash tests/reviewed-upgrade-plan.sh
          bash tests/reviewed-upgrade-wrapper.sh
          # Exit 77 means the fixture cannot run because this environment forbids
          # unprivileged user namespaces; report that as a skip, not a failure.
          root_packet_status=0
          bash tests/root-install-packet.sh || root_packet_status=$?
          if (( root_packet_status == 77 )); then
            echo 'root-install-packet lifecycle fixture skipped: unprivileged user namespaces are unavailable.'
          elif (( root_packet_status != 0 )); then
            exit "$root_packet_status"
          fi
          bash tests/otel-installer-guards.sh
          bash tests/otel-materialize-guards.sh

      - name: Check text and secret hygiene
        run: |
          git diff --check
          tests/compose-invariants.sh

      - name: Validate Compose model
        run: |
          docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet
          bash tests/compose-required-settings.sh
          bash tests/storage-compose.sh

      - name: Lint Dockerfile syntax
        run: |
          docker buildx build --check --file deploy/Dockerfile.mlflow deploy
          docker buildx build --check --file deploy/Dockerfile.laminar deploy
          docker buildx build --check --file deploy/Dockerfile.otel deploy

  otlp-runtime:
    name: Disposable OTLP dual-backend smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [success, missing-ingestion]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build, health-check, inject, and query the disposable stack
        run: OTLP_SMOKE_MODE=${{ matrix.mode }} bash tests/otlp-dual-backend-smoke.sh
      - name: Retain runtime diagnostics
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: otlp-runtime-diagnostics-${{ matrix.mode }}
          path: otlp-runtime-diagnostics.tar.gz
          if-no-files-found: warn
