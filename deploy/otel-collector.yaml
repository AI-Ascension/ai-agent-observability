extensions:
  health_check:
    # v0.160's component-status implementation is selected by the feature
    # gate passed in compose.yaml. The deprecated pipeline-failure poller is
    # intentionally absent.
    http:
      endpoint: 127.0.0.1:13133
      status:
        enabled: true
        path: /status
        include_attributes: false
    component_health:
      include_permanent_errors: true
      include_recoverable_errors: true
      recovery_duration: 30s
  # The Compose initializer creates these directories for the Collector's
  # non-root UID. These queues retain accepted requests across replacement of
  # the Collector process; they do not prove downstream backend persistence.
  file_storage/mlflow:
    directory: /var/lib/otelcol/storage/mlflow
    timeout: 10s
    max_size: 134217728
    fsync: true
    create_directory: true
    directory_permissions: "0750"
    compaction:
      directory: /var/lib/otelcol/compaction/mlflow
      on_start: true
      on_rebound: true
      cleanup_on_start: true
      max_transaction_size: 65536
      check_interval: 5m
      rebound_needed_threshold_mib: 96
      rebound_trigger_threshold_mib: 64
  file_storage/laminar:
    directory: /var/lib/otelcol/storage/laminar
    timeout: 10s
    max_size: 134217728
    fsync: true
    create_directory: true
    directory_permissions: "0750"
    compaction:
      directory: /var/lib/otelcol/compaction/laminar
      on_start: true
      on_rebound: true
      cleanup_on_start: true
      max_transaction_size: 65536
      check_interval: 5m
      rebound_needed_threshold_mib: 96
      rebound_trigger_threshold_mib: 64

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    send_batch_size: 128
    timeout: 5s

exporters:
  otlp_http/mlflow:
    endpoint: http://mlflow:5000
    headers:
      x-mlflow-experiment-id: "${MLFLOW_EXPERIMENT_ID}"
    compression: gzip
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      # Retry until bounded queue capacity is exhausted; observable enqueue
      # failure remains the loss signal rather than a false delivery claim.
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1024
      sizer: requests
      block_on_overflow: false
      storage: file_storage/mlflow

  otlp_http/laminar:
    endpoint: http://laminar-app-server:8000
    headers:
      authorization: "Bearer ${LAMINAR_PROJECT_API_KEY}"
    compression: gzip
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1024
      sizer: requests
      block_on_overflow: false
      storage: file_storage/laminar

service:
  extensions: [health_check, file_storage/mlflow, file_storage/laminar]
  telemetry:
    logs:
      level: warn
    # The guarded installer reads this loopback-only endpoint through the
    # published host port. It is read-only and exposes Collector internals
    # needed to prove that intake has stopped and exporter queues are empty.
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/mlflow, otlp_http/laminar]
