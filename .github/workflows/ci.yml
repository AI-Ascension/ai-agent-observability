name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate deployment contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned policy toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Validate local pinned standards
        run: cargo +1.97.1 run --locked --manifest-path standards/tools/standards-sync/Cargo.toml -- validate --root .

      - name: Prepare pinned ShellCheck
        run: |
          curl --fail --location --max-time 90 --output "$RUNNER_TEMP/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.10.0" >> "$GITHUB_PATH"

      - name: Prepare pinned Compose and jq
        env:
          COMPOSE_VERSION: 2.39.4
          # From https://github.com/docker/compose/releases/download/v2.39.4/checksums.txt
          COMPOSE_SHA256: 7af95166a730b87e172d4fc9aefea8725d3c6c7327d59149267b452114ddb7d4
          JQ_VERSION: 1.8.1
          # From https://github.com/jqlang/jq/releases/download/jq-1.8.1/sha256sum.txt
          JQ_SHA256: 020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d
        run: |
          compose_path="$RUNNER_TEMP/docker-compose"
          jq_path="$RUNNER_TEMP/jq"
          docker_config="$RUNNER_TEMP/docker-config"
          mkdir -p "$docker_config/cli-plugins"
          curl --fail --location --max-time 90 --output "$compose_path" \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          printf '%s  %s\n' "$COMPOSE_SHA256" "$compose_path" | sha256sum --check
          chmod 0755 "$compose_path"
          install -m 0755 "$compose_path" "$docker_config/cli-plugins/docker-compose"
          curl --fail --location --max-time 90 --output "$jq_path" \
            "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-amd64"
          printf '%s  %s\n' "$JQ_SHA256" "$jq_path" | sha256sum --check
          chmod 0755 "$jq_path"
          {
            printf 'DOCKER_CONFIG=%s\n' "$docker_config"
            printf 'COMPOSE_BINARY=%s\n' "$compose_path"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
          export DOCKER_CONFIG="$docker_config"
          export PATH="$RUNNER_TEMP:$PATH"
          compose_version="$(docker compose version --short)"
          jq_version="$(jq --version)"
          [[ "$compose_version" == "$COMPOSE_VERSION" ]] || {
            printf 'Expected Docker Compose %s, got %s\n' "$COMPOSE_VERSION" "$compose_version" >&2
            exit 1
          }
          [[ "$jq_version" == "jq-$JQ_VERSION" ]] || {
            printf 'Expected jq %s, got %s\n' "$JQ_VERSION" "$jq_version" >&2
            exit 1
          }
          printf 'Using Docker Compose %s and %s.\n' "$compose_version" "$jq_version"

      - name: Check shell syntax and style
        run: |
          for script in deploy/init.sh deploy/laminar/bootstrap-project-key.sh deploy/laminar/provision-query-readonly.sh tests/*.sh tests/fixtures/*; do
            bash -n "$script"
          done
          shellcheck --severity=warning deploy/init.sh deploy/laminar/bootstrap-project-key.sh deploy/laminar/provision-query-readonly.sh tests/*.sh tests/fixtures/*

      - name: Test bootstrap without a container runtime
        run: |
          bash tests/bootstrap.sh
          bash tests/validation-regressions.sh
          bash tests/query-provision-invariants.sh
          bash tests/query-provision-regressions.sh
          bash tests/compose-policy-regressions.sh

      - name: Check text and secret hygiene
        run: |
          if [[ "${{ github.event_name }}" == pull_request && -n "${{ github.event.pull_request.base.sha }}" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...$GITHUB_SHA"
          elif [[ "${{ github.event_name }}" == push && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}" "$GITHUB_SHA"
          else
            git diff --check HEAD^ HEAD
          fi
          tests/compose-invariants.sh

      - name: Validate Compose model
        run: |
          docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet
          bash tests/compose-required-settings.sh
          bash tests/compose-source-regressions.sh
          bash tests/compose-structured.sh

      - name: Lint Dockerfile syntax
        run: |
          docker buildx build --check --file deploy/Dockerfile.mlflow deploy
          docker buildx build --check --file deploy/Dockerfile.laminar deploy
