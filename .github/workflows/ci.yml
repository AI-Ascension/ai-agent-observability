name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate deployment contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check shell syntax and style
        run: |
          bash -n deploy/init.sh deploy/laminar/bootstrap-project-key.sh tests/compose-invariants.sh tests/bootstrap.sh tests/fixtures/*
          shellcheck --severity=warning deploy/init.sh deploy/laminar/bootstrap-project-key.sh tests/compose-invariants.sh tests/bootstrap.sh tests/fixtures/*

      - name: Test bootstrap without a container runtime
        run: bash tests/bootstrap.sh

      - name: Check text and secret hygiene
        run: |
          git diff --check
          tests/compose-invariants.sh

      - name: Validate Compose model
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet

      - name: Lint Dockerfile syntax
        run: |
          docker buildx build --check --file deploy/Dockerfile.mlflow deploy
          docker buildx build --check --file deploy/Dockerfile.laminar deploy
